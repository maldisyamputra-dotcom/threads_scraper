name: Karhutla Collector Threads (tanpa login)

# 2 SHARD PARALEL (matrix a/b) sejak 1 Nov 2026: tiap shard menangani
# 11 kata kunci (env KEYWORD_SHARD) dan menulis file shard sendiri
# (threads_data_nologin_{shard}.csv). Setelah scrape, merge_threads_shards.py
# menggabung kedua shard -> threads_data_nologin.csv (dedup post_id, global
# antar shard). Concurrency per shard supaya a dan b bisa jalan bersamaan;
# commit-back memakai pull --rebase + retry agar tidak konflik antar shard.
# Concurrency PER SHARD (di level job, karena context matrix hanya tersedia
# di sana): a dan b bisa jalan bersamaan; run shard yang sama tidak tumpang
# tindih. Commit-back memakai pull --rebase + retry agar tidak konflik
# antar shard.
# Repo PUBLIK -> menit Actions unlimited (standard runner), tanpa secret.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

permissions:
  contents: write  # untuk commit-back CSV hasil

jobs:
  collect:
    concurrency:
      group: threads-nologin-${{ matrix.shard }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        shard: [a, b]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # perlu riwayat penuh supaya pull --rebase bisa jalan

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Jalankan scraper Threads (shard ${{ matrix.shard }}, tanpa login)
        env:
          KEYWORD_SHARD: ${{ matrix.shard }}
        run: python threads_scraper_nologin.py

      - name: Merge shard -> CSV gabungan
        run: python merge_threads_shards.py

      - name: Commit-back hasil (kumulatif)
        run: |
          git config user.name "threads-collector"
          git config user.email "threads-collector@users.noreply.github.com"
          git add threads_data_nologin.csv "threads_data_nologin_${{ matrix.shard }}.csv"
          for f in threads_data_nologin_a.csv threads_data_nologin_b.csv; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "tidak ada baris baru, lewati commit"
          else
            git commit -m "threads nologin: tambah hasil scraping (shard ${{ matrix.shard }})"
            for i in 1 2 3 4 5; do
              git pull --rebase && git push && break || sleep 15
            done
          fi
